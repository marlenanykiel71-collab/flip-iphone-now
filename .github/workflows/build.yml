name: Deploy static build to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build static SPA
        run: npm run build

      - name: Prepare publish directory
        id: out
        run: |
          SRC=""
          for d in dist/client .output/public dist; do
            if [ -d "$d" ]; then SRC="$d"; break; fi
          done
          if [ -z "$SRC" ]; then echo "No build output"; ls -la; exit 1; fi
          echo "Using build output: $SRC"

          PUB="publish"
          rm -rf "$PUB"
          mkdir -p "$PUB"
          cp -r "$SRC"/. "$PUB"/

          # Ensure index.html at root (TanStack Start emits _shell.html as SPA shell)
          if [ ! -f "$PUB/index.html" ] && [ -f "$PUB/_shell.html" ]; then
            mv "$PUB/_shell.html" "$PUB/index.html"
          fi

          # Fix broken "/./assets/" paths → "./assets/" for relative hosting
          if [ -f "$PUB/index.html" ]; then
            sed -i 's|/\./assets/|./assets/|g' "$PUB/index.html"
          fi

          # GitHub Pages helper + required root files
          touch "$PUB/.nojekyll"
          for f in robots.txt favicon.ico og-image.png placeholder.svg; do
            [ -f "$PUB/$f" ] || cp "public/$f" "$PUB/$f" 2>/dev/null || true
          done

          # Remove any leftover shell file
          rm -f "$PUB/_shell.html"

          echo "dir=$PUB" >> $GITHUB_OUTPUT
          ls -la "$PUB"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ steps.out.outputs.dir }}
          force_orphan: true
          commit_message: "Deploy static build"
